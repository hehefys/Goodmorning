services:
  dyproxy:
    # 服务器上现成可用的镜像（node 基础镜像，提供 node 命令）。
    # 全新机器从头部署时，把下面两行换成：
    #   build: .
    #   image: dyproxy:3.1
    image: rsshub-ready
    container_name: dyproxy
    restart: unless-stopped

    ports:
      - "1200:1200"

    # Cookie 等敏感值只存在 .env（已 gitignore），绝不写进本文件
    env_file:
      - .env
    environment:
      - PORT=1200

    # 显式指定启动命令，不依赖镜像自身的 ENTRYPOINT/CMD 默认值
    entrypoint: ["node"]
    command: ["/app/dyproxy.cjs"]
    working_dir: /app

    # 代码以只读方式挂进容器，改代码后重建容器即生效，无需重新构建镜像
    volumes:
      - ./dyproxy.cjs:/app/dyproxy.cjs:ro

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:1200/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

    # 小内存机器必备：限制日志体积，避免日志把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
